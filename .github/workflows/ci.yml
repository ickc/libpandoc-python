name: CI

on:
  push:
    branches: [main]
  pull_request:
  # run by hand after libpandoc's `continuous` release changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBPANDOC_REPO: ickc/libpandoc
  LIBPANDOC_RELEASE: continuous
  # until panir is on PyPI
  PANIR: "panir @ git+https://github.com/ickc/panir@main#subdirectory=python"

jobs:
  wheel:
    name: wheel (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    # libpandoc-rs's: three times its longest green job (27 min, compiling
    # libpandoc.wasm with a cold cache on macOS): a hang fails, not after 6 hours
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04 }
          - { subdir: linux-aarch64, os: ubuntu-24.04-arm }
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # checked against the release's SHA256SUMS and attestations
      - name: Fetch libpandoc
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: ${{ matrix.subdir }}
        run: |
          files=("libpandoc-$SUBDIR.tar.gz")
          # and musl's, for the musllinux wheels
          if [[ $RUNNER_OS == Linux ]]; then files+=("libpandoc-$SUBDIR-musl.tar.gz"); fi
          scripts/fetch-libpandoc.sh "$RUNNER_TEMP/dl" "${files[@]}"
          # (from standard input: on Windows tar reads "D:..." as a host)
          mkdir libpandoc && tar -xz -C libpandoc < "$RUNNER_TEMP/dl/libpandoc-$SUBDIR.tar.gz"
          echo "LIBPANDOC_PREFIX=$PWD/libpandoc" >> "$GITHUB_ENV"
          if [[ $RUNNER_OS == Linux ]]; then
            mkdir libpandoc-musl && tar -xz -C libpandoc-musl < "$RUNNER_TEMP/dl/libpandoc-$SUBDIR-musl.tar.gz"
          fi

      - uses: actions/setup-python@v7
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v7
        id: py314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@v7
        id: py315
        with:
          python-version: "3.15"
      - uses: actions/setup-python@v7
        id: py311
        with:
          python-version: "3.11"
      - name: Python paths
        run: |
          echo "PY311=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PY314=${{ steps.py314.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PY314T=${{ steps.py314t.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PY315=${{ steps.py315.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: MSVC import library
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Make pandoc.lib
        if: runner.os == 'Windows'
        # "-" options: Git Bash would rewrite /nologo etc. as paths
        run: lib -nologo -def:libpandoc/lib/pandoc.def -out:libpandoc/lib/pandoc.lib -machine:x64

      - name: Build and bundle the wheel (Linux, manylinux container)
        if: runner.os == 'Linux'
        run: pipx run cibuildwheel==4.* --output-dir wheelhouse

      - name: Build the abi3 and free-threaded wheels
        if: runner.os != 'Linux'
        env:
          LIBPANDOC_RPATH: "1"
        run: |
          for py in "$PY311" "$PY314T"; do
            "$py" -m pip install build
            "$py" -m build --wheel --outdir raw
          done
          ls raw

      - name: Bundle libpandoc into the wheel
        if: runner.os != 'Linux'
        run: |
          case "$RUNNER_OS" in
            macOS)
              "$PY311" -m pip install delocate
              "$(dirname "$PY311")/delocate-wheel" -w wheelhouse -v raw/*.whl ;;
            Windows)
              "$PY311" -m pip install delvewheel
              "$PY311" -m delvewheel repair --add-path "$LIBPANDOC_PREFIX/bin" -w wheelhouse raw/*.whl ;;
          esac
          ls -la wheelhouse

      # libpandoc-rs's example filters built for wasm, for the wasm filter tests
      # (in pwsh: in bash on Windows, Git's /usr/bin/link shadows MSVC's for build scripts)
      - name: Wasm filters
        shell: pwsh
        run: |
          rustup target add wasm32-wasip1
          git clone --depth 1 https://github.com/ickc/libpandoc-rs "$env:RUNNER_TEMP/libpandoc-rs"
          cargo build --release --target wasm32-wasip1 --quiet --manifest-path "$env:RUNNER_TEMP/libpandoc-rs/filters/Cargo.toml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "LIBPANDOC_WASM_FILTERS=$env:RUNNER_TEMP/libpandoc-rs/filters/target/wasm32-wasip1/release" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # libpandoc.wasm (~60 MB) for the directory sandbox's tests, and
      # wasmtime's compilation of it (20 s and 8 GB of memory on a desktop,
      # minutes on a runner), kept between runs until the release's module or
      # the newest wasmtime (which the tests install) changes
      - name: libpandoc.wasm (continuous release), which version
        id: wasm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh release view "$LIBPANDOC_RELEASE" -R "$LIBPANDOC_REPO" --json assets \
            -q '.assets[] | select(.name == "libpandoc.wasm") | .digest')
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          wasmtime=$(curl -fsSL https://pypi.org/pypi/wasmtime/json \
            | "$PY311" -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "wasmtime=$wasmtime" >> "$GITHUB_OUTPUT"
          echo "LIBPANDOC_WASM=$RUNNER_TEMP/libpandoc-wasm/libpandoc.wasm" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: wasm-cache
        with:
          path: |
            ${{ runner.temp }}/libpandoc-wasm
            ~/.cache/wasmtime
            ~/Library/Caches/BytecodeAlliance.wasmtime
            ~/AppData/Local/BytecodeAlliance/wasmtime
          key: libpandoc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ steps.wasm.outputs.sha256 }}-wasmtime-${{ steps.wasm.outputs.wasmtime }}
      # checked against the release's SHA256SUMS and attestation
      - name: libpandoc.wasm (download)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-libpandoc.sh "$RUNNER_TEMP/libpandoc-wasm" libpandoc.wasm

      # what the wheels bundle, with its licences: libpandoc's COPYING.md
      # and THIRD-PARTY-NOTICES (which cover the libraries auditwheel,
      # delocate and delvewheel graft: GMP, libffi; on musl libstdc++ and
      # libgcc), beside the package's own
      - name: The wheels carry libpandoc's licence and notices
        run: |
          for w in wheelhouse/*.whl; do
            "$PY311" -c 'import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); missing = [f for f in sys.argv[2:] if not any(x.endswith(".dist-info/licenses/" + f) for x in n)]; sys.exit(missing and f"{sys.argv[1]}: no {missing}")' \
              "$w" COPYING.md libpandoc-licenses/COPYING.md libpandoc-licenses/THIRD-PARTY-NOTICES
          done

      - name: Test the wheel
        env:
          # every sandboxed conversion in the tests is limited (pandocpy's set
          # their own): one that hangs fails in minutes
          LIBPANDOC_WASM_TIMEOUT: "120"
        run: |
          # outside the source tree, so that the installed package is tested
          for py in "$PY311" "$PY314" "$PY314T" "$PY315"; do
            v=venv$(basename "$(dirname "$py")")-$RANDOM
            "$py" -m venv "$v"
            if [[ $RUNNER_OS == Windows ]]; then bin=Scripts; else bin=bin; fi
            "$v/$bin/python" -m pip install "$PANIR" pytest panflute pandocfilters wasmtime
            # the abi3 wheel, or the free-threaded one
            "$v/$bin/python" -m pip install --no-index --find-links wheelhouse libpandoc
            (cd tests && "../$v/$bin/python" -m pytest -v -p no:cacheprovider --rootdir=. .)
          done

      # in the musllinux image, whose Pythons are musl's: abi3 on 3.14, and 3.14t
      - name: Test the musllinux wheels
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/project" -w /project -e PANIR \
            "quay.io/pypa/musllinux_1_2_$(uname -m)" bash -c '
              set -e
              for py in cp314-cp314 cp314-cp314t; do
                /opt/python/$py/bin/python -m venv /tmp/v-$py
                /tmp/v-$py/bin/pip install -q "$PANIR" pytest panflute pandocfilters
                /tmp/v-$py/bin/pip install -q --no-index --find-links wheelhouse libpandoc
                (cd tests && /tmp/v-$py/bin/python -m pytest -q -p no:cacheprovider --rootdir=. .)
              done'

      - name: Same as the pandoc command (pandoc's own command tests)
        if: matrix.subdir == 'linux-64'
        run: |
          python -m venv venv-conf
          venv-conf/bin/python -m pip install "$PANIR" pytest
          venv-conf/bin/python -m pip install --no-index --find-links wheelhouse libpandoc
          v=$(venv-conf/bin/python -c "import libpandoc; print(libpandoc.pandoc_version())")
          # the pandoc command and source of the version libpandoc embeds
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-linux-amd64.tar.gz" | tar -xz
          curl -fsSL "https://hackage.haskell.org/package/pandoc-$v/pandoc-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          export PATH="$PWD/pandoc-$v/bin:$PATH"
          pandoc --version | head -1
          (cd tests && ../venv-conf/bin/python -m pytest -v -p no:cacheprovider --rootdir=. test_cli.py)
          venv-conf/bin/python tests/conformance.py "$RUNNER_TEMP/pandoc-$v" --pandoc "$PWD/pandoc-$v/bin/pandoc"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.subdir }}
          path: wheelhouse/*.whl

  # The wheel for Pyodide (scripts/pyodide-wheel.sh: libpandoc.wasm and its
  # JS from the same libpandoc release), installed by micropip in Pyodide in
  # Node, loading libpandoc.wasm itself: the API and AST tests but the three
  # that need threads
  pyodide:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # GHC's wasm needs a recent V8
          node-version: 26
      - name: libpandoc.wasm and libpandoc's hosts
        run: |
          scripts/fetch-libpandoc.sh "$RUNNER_TEMP/wasm" libpandoc.wasm libpandoc-pyodide.mjs \
            libpandoc-wasm-THIRD-PARTY-NOTICES.txt
          git clone --depth 1 "https://github.com/$LIBPANDOC_REPO" "$RUNNER_TEMP/libpandoc"
          (cd "$RUNNER_TEMP/libpandoc/wasm" && npm ci)
      - name: The wheel
        run: |
          python3 -m pip install wheel
          PYTHON=python3 scripts/pyodide-wheel.sh "$RUNNER_TEMP/wasm" wheelhouse
      - name: Pyodide and panir
        run: |
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm init -y >/dev/null && npm install pyodide@314.0.8
          python3 -m pip wheel --no-deps -w wheels "$PANIR"
      - name: Test
        run: |
          WHEEL=$(ls wheelhouse/libpandoc-*-pyemscripten_2026_0_wasm32.whl) PYODIDE="$RUNNER_TEMP/pyodide" \
            PANIR_WHEEL=$(ls "$RUNNER_TEMP"/pyodide/wheels/panir-*.whl) LIBPANDOC_PYTHON="$GITHUB_WORKSPACE" \
            node "$RUNNER_TEMP/libpandoc/wasm/test-pyodide-suite.mjs" tests/test_api.py tests/test_ast.py \
            --deselect tests/test_api.py::test_threads \
            --deselect tests/test_api.py::test_num_threads \
            --deselect tests/test_api.py::test_num_threads_from_the_environment
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-pyodide
          path: wheelhouse/*.whl
