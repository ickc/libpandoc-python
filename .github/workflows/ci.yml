name: CI

on:
  push:
    branches: [main]
  pull_request:
  # run by hand after libpandoc's `continuous` release changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBPANDOC_REPO: ickc/libpandoc
  LIBPANDOC_RELEASE: continuous
  # until panir is on PyPI
  PANIR: "panir @ git+https://github.com/ickc/panir@main#subdirectory=python"

jobs:
  wheel:
    name: wheel (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04 }
          - { subdir: linux-aarch64, os: ubuntu-24.04-arm }
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Fetch libpandoc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIBPANDOC_RELEASE" -R "$LIBPANDOC_REPO" -p "libpandoc-${{ matrix.subdir }}.tar.gz"
          mkdir libpandoc && tar -xzf "libpandoc-${{ matrix.subdir }}.tar.gz" -C libpandoc
          echo "LIBPANDOC_PREFIX=$PWD/libpandoc" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v6
        id: py314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@v6
        id: py310
        with:
          python-version: "3.10"
      - name: Python paths
        run: |
          echo "PY310=${{ steps.py310.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PY314=${{ steps.py314.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PY314T=${{ steps.py314t.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: MSVC import library
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Make pandoc.lib
        if: runner.os == 'Windows'
        # "-" options: Git Bash would rewrite /nologo etc. as paths
        run: lib -nologo -def:libpandoc/lib/pandoc.def -out:libpandoc/lib/pandoc.lib -machine:x64

      - name: Build and bundle the wheel (Linux, manylinux container)
        if: runner.os == 'Linux'
        run: pipx run cibuildwheel==3.* --output-dir wheelhouse

      - name: Build the abi3 and free-threaded wheels
        if: runner.os != 'Linux'
        env:
          LIBPANDOC_RPATH: "1"
        run: |
          for py in "$PY310" "$PY314T"; do
            "$py" -m pip install build
            "$py" -m build --wheel --outdir raw
          done
          ls raw

      - name: Bundle libpandoc into the wheel
        if: runner.os != 'Linux'
        run: |
          case "$RUNNER_OS" in
            macOS)
              "$PY310" -m pip install delocate
              "$(dirname "$PY310")/delocate-wheel" -w wheelhouse -v raw/*.whl ;;
            Windows)
              "$PY310" -m pip install delvewheel
              "$PY310" -m delvewheel repair --add-path "$LIBPANDOC_PREFIX/bin" -w wheelhouse raw/*.whl ;;
          esac
          ls -la wheelhouse

      - name: Test the wheel
        run: |
          # outside the source tree, so that the installed package is tested
          for py in "$PY310" "$PY314" "$PY314T"; do
            v=venv$(basename "$(dirname "$py")")-$RANDOM
            "$py" -m venv "$v"
            if [[ $RUNNER_OS == Windows ]]; then bin=Scripts; else bin=bin; fi
            "$v/$bin/python" -m pip install "$PANIR" pytest panflute pandocfilters
            # the abi3 wheel, or the free-threaded one
            "$v/$bin/python" -m pip install --no-index --find-links wheelhouse libpandoc
            (cd tests && "../$v/$bin/python" -m pytest -v -p no:cacheprovider --rootdir=. .)
          done

      - name: Same as the pandoc command (pandoc's own command tests)
        if: matrix.subdir == 'linux-64'
        run: |
          python -m venv venv-conf
          venv-conf/bin/python -m pip install "$PANIR" pytest
          venv-conf/bin/python -m pip install --no-index --find-links wheelhouse libpandoc
          v=$(venv-conf/bin/python -c "import libpandoc; print(libpandoc.pandoc_version())")
          # the pandoc command and source of the version libpandoc embeds
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-linux-amd64.tar.gz" | tar -xz
          curl -fsSL "https://hackage.haskell.org/package/pandoc-$v/pandoc-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          export PATH="$PWD/pandoc-$v/bin:$PATH"
          pandoc --version | head -1
          (cd tests && ../venv-conf/bin/python -m pytest -v -p no:cacheprovider --rootdir=. test_cli.py)
          venv-conf/bin/python tests/conformance.py "$RUNNER_TEMP/pandoc-$v" --pandoc "$PWD/pandoc-$v/bin/pandoc"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.subdir }}
          path: wheelhouse/*.whl

  # The Pyodide backend (_wasm), on libpandoc.wasm from the same libpandoc
  # release, with libpandoc's JavaScript hosts: the API and AST tests but
  # the three that need threads
  pyodide:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # GHC's wasm needs a recent V8
          node-version: 26
      - name: libpandoc.wasm and libpandoc's hosts
        run: |
          gh release download "$LIBPANDOC_RELEASE" -R "$LIBPANDOC_REPO" -p libpandoc.wasm -D "$RUNNER_TEMP"
          git clone --depth 1 "https://github.com/$LIBPANDOC_REPO" "$RUNNER_TEMP/libpandoc"
          (cd "$RUNNER_TEMP/libpandoc/wasm" && npm ci)
      - name: Pyodide and panir
        run: |
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm init -y >/dev/null && npm install pyodide@314.0.7
          python3 -m pip wheel --no-deps -w wheels "$PANIR"
      - name: Test
        run: |
          SHIM=1 LIBPANDOC_WASM="$RUNNER_TEMP/libpandoc.wasm" PYODIDE="$RUNNER_TEMP/pyodide" \
            PANIR_WHEEL=$(ls "$RUNNER_TEMP"/pyodide/wheels/panir-*.whl) LIBPANDOC_PYTHON="$GITHUB_WORKSPACE" \
            node "$RUNNER_TEMP/libpandoc/wasm/test-pyodide-suite.mjs" tests/test_api.py tests/test_ast.py \
            --deselect tests/test_api.py::test_threads \
            --deselect tests/test_api.py::test_num_threads \
            --deselect tests/test_api.py::test_num_threads_from_the_environment
