[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libpandoc"
version = "0.1.0"
description = "pandoc as a Python library: in process, through libpandoc's C ABI, with its AST as Python classes"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["COPYING.md"]
authors = [{ name = "Kolen Cheung" }]
requires-python = ">=3.10"
dependencies = ["pandom >=0.1, <0.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Repository = "https://github.com/ickc/libpandoc-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux wheels: built and repaired in the manylinux_2_28 container, against
# the libpandoc staged in ./libpandoc (CI fetches it). One abi3 build serves
# every Python; CI tests the wheel itself afterwards.
[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_*"
test-skip = "*"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
environment = { LIBPANDOC_PREFIX = "/project/libpandoc", LIBPANDOC_RPATH = "1" }
repair-wheel-command = "LD_LIBRARY_PATH=/project/libpandoc/lib auditwheel repair --plat manylinux_2_28_$(uname -m) -w {dest_dir} {wheel}"
