[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libpandoc"
version = "0.1.0"
description = "pandoc as a Python library: in process, through libpandoc's C ABI, with its AST as Python classes"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["COPYING.md"]
authors = [{ name = "Kolen Cheung" }]
requires-python = ">=3.10"
dependencies = ["panir >=0.1, <0.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
# wasm filters (-F foo.wasm, WasmFilter), run in process by wasmtime
wasm = ["wasmtime >=49"]

[project.scripts]
pandocpy = "libpandoc.cli:run_main"

[project.urls]
Repository = "https://github.com/ickc/libpandoc-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux wheels: built and repaired in the manylinux_2_28 container against
# the libpandoc staged in ./libpandoc, and in the musllinux_1_2 one against
# libpandoc's musl build in ./libpandoc-musl (CI fetches both). One abi3
# build serves every Python with a GIL, and one more free-threaded CPython
# 3.14t; CI tests the wheels themselves afterwards.
[tool.cibuildwheel]
build = "cp310-* cp314t-*"
test-skip = "*"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
environment = { LIBPANDOC_PREFIX = "/project/libpandoc", LIBPANDOC_RPATH = "1" }
repair-wheel-command = "LD_LIBRARY_PATH=/project/libpandoc/lib auditwheel repair --plat manylinux_2_28_$(uname -m) -w {dest_dir} {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
environment = { LIBPANDOC_PREFIX = "/project/libpandoc-musl", LIBPANDOC_RPATH = "1" }
repair-wheel-command = "LD_LIBRARY_PATH=/project/libpandoc-musl/lib auditwheel repair --plat musllinux_1_2_$(uname -m) -w {dest_dir} {wheel}"
