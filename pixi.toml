[workspace]
name = "libpandoc-python"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
pip = "*"
setuptools = ">=77"
wheel = "*"
pytest = "*"
ruff = "*"

[tasks]
# libpandoc-ast from a checkout next to this one (as in project-libpandoc)
dev-ast = "pip install --no-deps -e ../libpandoc-ast/python"
# build against a staged libpandoc in $LIBPANDOC_PREFIX
dev = { cmd = "pip install --no-build-isolation --no-deps -e .", env = { LIBPANDOC_RPATH = "1" } }
test = "pytest -v"
